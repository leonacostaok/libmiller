[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "libmiller"
version = "0.2.0"
description = "Python bindings for deterministic Miller primality checking"
requires-python = ">=3.9"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "Leon Acosta"}]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Mathematics"]

[tool.setuptools]
packages = ["libmiller"]

[tool.setuptools.package-data]
libmiller = ["py.typed"]
